services:
  backend:
    build: ./backend
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: database
      DB_PORT: 5432
      SERVER_PORT: ${SERVER_PORT}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${CLIENT_PORT}:80"
    depends_on:
      - backend

  database:
    image: postgres:18-alpine
    env_file:
      - ./backend/.env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata: