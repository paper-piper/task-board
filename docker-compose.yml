services:
  backend:
    build: ./backend
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
      SERVER_PORT: ${SERVER_PORT}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${CLIENT_PORT}:80"
    depends_on:
      - backend
